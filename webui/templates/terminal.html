{% extends "base.html" %}

{% block content %}
<div class="card">
  <div class="row" style="margin-bottom:10px">
    <h2 class="card-title" style="margin:0">Web 终端</h2>
    <span id="term-state" class="pill">未连接</span>
    <span class="spacer"></span>
    <span class="muted">以面板进程的用户身份执行命令，请谨慎操作</span>
    <button class="btn btn-sm" id="btn-reconnect">重新连接</button>
  </div>
  <div id="term" style="height:62vh;background:#0a0e17;border:1px solid var(--border);border-radius:8px;padding:6px"></div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
{% endblock %}

{% block scripts %}
<script src="/static/js/terminal.js"></script>
{% endblock %}
