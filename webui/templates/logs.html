{% extends "base.html" %}

{% block content %}
<div class="tab-bar" id="source-tabs">
  <div class="tab active" data-source="nonebot">NoneBot</div>
  <div class="tab" data-source="napcat">NapCat</div>
  <div class="tab" data-source="webui">面板自身</div>
  <div class="tab" data-source="searxng">SearXNG</div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:10px">
    <input id="log-search" type="search" placeholder="过滤关键字…" style="max-width:220px">
    <select id="log-lines">
      <option value="100">100 行</option>
      <option value="200" selected>200 行</option>
      <option value="500">500 行</option>
      <option value="1000">1000 行</option>
    </select>
    <button class="btn btn-sm" id="btn-refresh">刷新</button>
    <button class="btn btn-sm" id="btn-older">加载更早</button>
    <button class="btn btn-sm" id="btn-tail">自动跟踪：开</button>
    <span class="spacer"></span>
    <span id="tail-state" class="pill" style="display:none"></span>
    <button class="btn btn-sm btn-danger" id="btn-clear">清空</button>
  </div>
  <div class="log-box" id="log-box">加载中…</div>
  <p class="muted" style="margin:8px 0 0">
    日志中的 API 密钥与 Bearer 令牌已自动脱敏。SearXNG 日志来自 <code>docker logs</code>，无法清空。
  </p>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/logs.js"></script>
{% endblock %}
