{% extends "base.html" %}

{% block content %}
<div class="row">
  <h2 class="card-title" style="margin:0">Wiki 缓存状态</h2>
  <span class="spacer"></span>
  <span class="muted mono" id="wk-root">—</span>
  <button class="btn btn-sm" id="wk-refresh">刷新</button>
</div>

<div class="row" style="align-items:flex-start">
  <div class="card" id="wk-wiki" style="flex:1;min-width:280px">
    <h2 class="card-title">wiki_cache（角色/羁绊资料）</h2>
    <div class="muted">加载中…</div>
  </div>
  <div class="card" id="wk-redeem" style="flex:1;min-width:280px">
    <h2 class="card-title">redeem_code（兑换码缓存）</h2>
    <div class="muted">加载中…</div>
  </div>
</div>

<div class="card" id="wk-aliases">
  <div class="row">
    <h2 class="card-title" style="margin:0">别名管理</h2>
    <span class="spacer"></span>
    <button class="btn btn-sm wk-kind active" data-kind="char">角色</button>
    <button class="btn btn-sm wk-kind" data-kind="bond">羁绊</button>
    <button class="btn btn-sm" id="wk-alias-new" title="手动创建新分组（字典与缓存中都不存在的名称）">新建分组</button>
    <input type="text" id="wk-alias-q" placeholder="搜索名称或别名…" style="width:200px">
  </div>
  <div id="wk-alias-missing"></div>
  <p class="muted" id="wk-alias-stat" style="margin:8px 0 0"></p>
  <div id="wk-alias-list" class="muted" style="margin-top:10px">加载中…</div>
</div>

<p class="muted">缓存文件由 bot 侧工具维护，统计卡片为只读展示；如数据过期可在 Web 终端手动删除对应 JSON 触发重建。别名保存后约 10 秒内 bot 自动生效，无需重启。</p>
{% endblock %}

{% block scripts %}
<script src="/static/js/wiki.js"></script>
{% endblock %}
