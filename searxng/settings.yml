# SearXNG configuration for QQBot Agent
# Optimized for access from mainland China

use_default_settings: true

general:
  instance_name: "QQBot Search"

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  secret_key: "qqbot-agent-searxng-secret-change-in-production"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  # Allow search API access from any host (internal service)
  public_instance: false

ui:
  static_use_hash: true
  default_theme: simple
  default_locale: zh-Hans-CN

# Engines: prioritized for access from mainland China
# - bing / bing_news: primary, stable from China
# - duckduckgo: fallback, intermittent (short timeout)
# - mwmbl: independent index, no API key, small but free
engines:
  - name: bing
    engine: bing
    shortcut: bi
    # 2026-09-22 disabled: via proxy bing serves bot-flagged garbage (results
    # unrelated to query); via direct cn.bing.com the adapter parses 0 results.
    disabled: true
    timeout: 10.0
    proxies: {}

  - name: bing news
    engine: bing_news
    shortcut: bin
    # 2026-09-22 disabled: same bot-flagged degradation as bing
    disabled: true
    timeout: 10.0
    proxies: {}

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    timeout: 6.0

  - name: mwmbl
    engine: mwmbl
    shortcut: mw
    disabled: false
    timeout: 5.0

  # --- CN-reachable engines added 2026-09-22 ---
  # Direct connection (proxies: {} overrides the global sing-box proxy):
  # baidu/sogou/quark are reachable from mainland CN and serve as fallback
  # when bing degrades / duckduckgo hits CAPTCHA.
  - name: baidu
    disabled: false
    timeout: 8.0
    proxies: {}

  - name: sogou
    disabled: false
    timeout: 8.0
    proxies: {}

  - name: quark
    # 2026-09-22: returns 0 results from this host even for simple queries; disabled
    disabled: true
    timeout: 8.0
    proxies: {}

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  # Retry once on upstream failure (catches intermittent Bing timeouts)
  retries: 1
  # Route all outgoing requests through the sing-box HTTP proxy (host gateway)
  # to bypass GFW blocking of google / duckduckgo / wikipedia.
  proxies:
    http: http://172.18.0.1:1081
    https: http://172.18.0.1:1081
